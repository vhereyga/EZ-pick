name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # remove possible Windows CR characters from secrets
          VITE_SUPABASE_URL=$(echo -n "${VITE_SUPABASE_URL}" | tr -d '\r')

          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "❌ ERROR: GitHub Secrets not configured!"
            echo "Please set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in:"
            echo "Settings → Secrets and variables → Actions"
            exit 1
          fi

          case "$VITE_SUPABASE_URL" in
            http://*|https://*) ;; 
            *)
              echo "❌ ERROR: Invalid VITE_SUPABASE_URL: must start with http:// or https://"
              exit 1
              ;;
          esac

          # show host only (masked) for debugging
          echo "Using Supabase host: $(echo $VITE_SUPABASE_URL | sed -E 's@^(https?://[^/]+).*@\1@')"

          npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
